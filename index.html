<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan del Aconcagua</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script defer src="js/main.js"></script>
    <link rel="icon" href="assets/img/logo.png"> 
</head>
<body>
    <header class="encabezado">
    <div class="encabezado-marca">
        <img src="assets/img/logo.png" alt="Logo de Pan del Aconcagua" class="logo">
        <div class="encabezado-titulo">
            <h1>Pan del Aconcagua</h1>
            <p>Panadería artesanal</p>
        </div>
    </div>
    <button type="button" id="ver-carrito" class="btn-carrito">Ver carrito (<span id="contador">0</span>)</button>
</header>

 
    <main class="contenido">
        <div class="barra-busqueda">
            <input type="search" id="busqueda" placeholder="Buscar producto por nombre">
        </div>
 
        <section>
            <h2>Productos</h2>
            <p id="cargando">Cargando productos</p>
            <div id="productos" class="grilla"></div>
        </section>
    </main>
 
    <aside class="carrito" aria-label="Carrito de compras">
        <div class="carrito-cabecera">
            <h2>Tu carrito</h2>
            <button type="button" class="cerrar">Cerrar</button>
        </div>
 
        <ul id="lista"></ul>
 
        <div class="carrito-pie">
            <p id="total" class="total"></p>
            <div class="carrito-acciones">
                <button type="button" id="vaciar">Vaciar carrito</button>
                <button type="button" id="compra">Comprar</button>
            </div>
        </div>
    </aside>
    <section id="checkout" class="checkout oculto">
    <div class="checkout-caja">
        <h2>Finalizar compra</h2>
        <h3>Resumen del pedido</h3>
        <ul id="resumen" class="resumen"></ul>
        <p id="envio-detalle"></p>
        <p id="total-checkout" class="total"></p>
 
        <form id="form-compra" class="form-compra">
            <label for="nombre">Nombre y apellido</label>
            <input type="text" id="nombre">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono">
 
            <fieldset>
                <legend>Entrega</legend>
                <label><input type="radio" name="entrega" value="retiro" checked> Retiro en el local</label>
                <label><input type="radio" name="entrega" value="envio"> Envío a domicilio (+$1.500)</label>
            </fieldset>
 
            <div id="campo-direccion" class="oculto">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion">
            </div>
 
            <fieldset>
                <legend>Forma de pago</legend>
                <label><input type="radio" name="pago" value="Efectivo" checked> Efectivo</label>
                <label><input type="radio" name="pago" value="Transferencia"> Transferencia</label>
                <label><input type="radio" name="pago" value="Tarjeta"> Tarjeta</label>
            </fieldset>
 
            <label for="notas">Aclaraciones (opcional)</label>
            <input type="text" id="notas">
 
            <p id="error-form" class="error-form"></p>
            <button type="button" id="volver">Volver al carrito</button>
            <button type="submit" id="confirmar">Confirmar pedido</button>
        </form>
    </div>
</section>

</body>
</html>
